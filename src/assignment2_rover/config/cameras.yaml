# Observed with gz topic -l / -i in fei_lrs_precision_landing.world.
- ros_topic_name: /drone_1/down_camera/image_raw
  gz_topic_name: /drone_1/down_camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- ros_topic_name: /drone_1/down_camera/camera_info
  gz_topic_name: /drone_1/down_camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- ros_topic_name: /drone_2/down_camera/image_raw
  gz_topic_name: /drone_2/down_camera/image_raw
